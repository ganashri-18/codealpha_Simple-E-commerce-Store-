{% extends "base.html" %}

{% block content %}

<div class="details">

    {% if product.image_url %}

        <img
            src="{{ product.image_url }}"
            alt="{{ product.name }}"
        >

    {% else %}

        <div class="big-image">
            🛍️
        </div>

    {% endif %}


    <div>

        <h1>
            {{ product.name }}
        </h1>

        <h2>
            ₹{{ product.price }}
        </h2>

        <p>
            {{ product.description }}
        </p>

        <p>
            Stock:
            {{ product.stock }}
        </p>

        <a
            href="{% url 'add_to_cart' product.id %}"
            class="btn"
        >
            Add to Cart
        </a>

    </div>

</div>

{% endblock %}
