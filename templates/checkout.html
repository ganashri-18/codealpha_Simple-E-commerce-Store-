{% extends "base.html" %}

{% block content %}

<div class="form-box">

    <h1>
        Checkout
    </h1>

    <h2>
        Total: ₹{{ total }}
    </h2>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn"
        >
            Place Order
        </button>

    </form>

</div>

{% endblock %}
