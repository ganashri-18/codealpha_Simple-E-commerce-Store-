{% extends "base.html" %}

{% block content %}

<div class="form-box">

    <h1>
        Create Account
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn"
        >
            Register
        </button>

    </form>

</div>

{% endblock %}
